# ---- Monitor ----
# "preferred" = usa a resolução/taxa nativa detectada automaticamente
monitor=,preferred,auto,1

# ---- Programas que iniciam junto com a sessão ----
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hyprpolkitagent

# ---- Variáveis de ambiente (essenciais p/ apps GTK/Qt funcionarem bem no Wayland) ----
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

# ---- Input ----
input {
    kb_layout = br
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- Aparência geral ----
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    # blur leve — pensado pra notebook, não pesado
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# Animações moderadas — fluidez sem exagero de GPU
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = workspaces, 1, 4, myBezier
}

dwindle {
    preserve_split = true
}

# ---- Atalhos de teclado essenciais ----
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, F, fullscreen,

# Trocar de workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Mover janela ativa para workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Mover janela com o mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
