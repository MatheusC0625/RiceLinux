# ---- Monitor ----
# "preferred" = usa a resolução/taxa nativa detectada automaticamente
monitor=,preferred,auto,1

# ---- Programas que iniciam junto com a sessão ----
exec-once = waybar
exec-once = mako
exec-once = swww-daemon
exec-once = hyprpolkitagent

# ---- Variáveis de ambiente (essenciais p/ apps GTK/Qt funcionarem bem no Wayland) ----
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

# ---- Input ----
input {
    kb_layout = br
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- Aparência geral ----
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    # blur leve — pensado pra notebook, não pesado
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# Animações moderadas — fluidez sem exagero de GPU
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = workspaces, 1, 4, myBezier
}

dwindle {
    preserve_split = true
}

# ---- Atalhos de teclado essenciais ----
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, wlogout -p layer-shell --buttons-per-row 5 --column-spacing 15 --row-spacing 15
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, F, fullscreen,

# Trocar de workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Mover janela ativa para workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Mover janela com o mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---- Screenshots ----
# Print inteiro salva em arquivo
bind = , Print, exec, grim ~/Pictures/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
# Super+Print: seleciona regiao com o mouse e salva
bind = SUPER, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
# Super+Shift+S: seleciona regiao e copia pro clipboard
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# ---- Teclas de midia: volume ----
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 2.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ---- Teclas de midia: brilho ----
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ---- Autostart de apps do usuario ----
# cava (visualizador de audio) no terminal
# fastfetch em um terminal (mantem aberto apos rodar)
# Spotify (flatpak)

# ---- Regras de janela ----
# Spotify sempre abre no workspace 2

# ---- Regras: cava e fastfetch no workspace 1, lado a lado ----

# ---- Regras de janela (sintaxe Hyprland 0.55+) ----

# ---- Autostart de apps (Spotify primeiro para nao roubar foco no final) ----
exec-once = flatpak run com.spotify.Client

# ---- Regras de janela (sintaxe Hyprland 0.55+) ----
# Spotify no workspace 2

# cava: metade esquerda superior (1/4 da tela)

# fastfetch: metade direita superior (1/4 da tela)

# ---- Foca workspace 1 apos autostart (evita terminar no Spotify) ----
exec-once = sleep 3 && hyprctl dispatch workspace 1

# ---- cava: metade superior esquerda (1/4 da tela) ----

# ---- fastfetch: metade superior direita (1/4 da tela) ----

# ---- Terminais decorativos com titulo fixo p/ regras casarem na abertura ----

# cava: superior esquerda (1/4 da tela)

# fastfetch: superior direita (1/4 da tela)

# ---- Terminais decorativos (cava + fastfetch) em tiling no workspace 1 ----

# ---- Workspaces fixos por monitor ----
# Notebook (eDP-1): workspaces 1, 2, 3
# Monitor LG (HDMI-A-1): workspaces 4, 5, 6

# ---- cava e fastfetch: metade superior, cada um 1/4 da tela ----
# cava: canto superior esquerdo

# fastfetch: canto superior direito

# ---- cava e fastfetch: metade superior, cada um 1/4 da tela (valores em pixels) ----
# cava: canto superior esquerdo

# fastfetch: canto superior direito

# ---- Layout fixo das janelas (posicoes definidas pelo usuario) ----
# cava: superior esquerdo, workspace 1

# fastfetch: inferior direito, workspace 1

# spotify: workspace 2, floating posicionado

# ---- Conky (relogio de desktop) ----
exec-once = conky -c /home/matheus/.config/conky/conky.conf

# ---- Conky: fixar no workspace 2, posicao atual ----
windowrule = workspace 1,match:class conky
windowrule = float on,match:class conky
windowrule = move 1309 834,match:class conky

# ---- Troca de wallpaper ----
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh

# ---- cava e fastfetch: fixar posicao + efeito glass ----


# ---- Autostart cava e fastfetch (limpo) ----
exec-once = [workspace 2 silent] kitty --class cava-term -e cava
exec-once = [workspace 1 silent] kitty --class fetch-term -e bash -c "fastfetch; exec bash"

# ---- Widgets fixos (posicao, tamanho, workspace, glass) ----
# fastfetch: workspace 1
windowrule = workspace 1,match:class fetch-term
windowrule = float on,match:class fetch-term
windowrule = size 775 582,match:class fetch-term
windowrule = move 31 33,match:class fetch-term
windowrule = opacity 0.75 0.75,match:class fetch-term

# cava: workspace 2
windowrule = workspace 2,match:class cava-term
windowrule = float on,match:class cava-term
windowrule = size 767 332,match:class cava-term
windowrule = move 1068 721,match:class cava-term
windowrule = opacity 0.75 0.75,match:class cava-term

# spotify: workspace 2
windowrule = workspace 2,match:class .*[Ss]potify.*
windowrule = float on,match:class .*[Ss]potify.*
windowrule = size 800 747,match:class .*[Ss]potify.*
windowrule = move 40 59,match:class .*[Ss]potify.*

# ---- Workspaces 5 e 6 ----
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# ---- Gravacao de tela (toggle, com selecao de area) ----
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/screenrecord.sh

# ---- Restaura ultimo wallpaper no boot (swww) ----
exec-once = sleep 1 && swww img "$(cat ~/.config/hypr/.last_wallpaper 2>/dev/null || echo ~/Pictures/wallpapers/anime-gruvbox.png)"

# ---- Menu de Wi-Fi ----
bind = $mainMod, N, exec, ~/.config/hypr/scripts/wifi.sh

# ---- Escuta conexao de monitor e reaplica wallpaper ----
exec-once = ~/.config/hypr/scripts/monitor-wallpaper.sh

# ---- Preferencia de workspace por monitor (nao rigido) ----
workspace = 1, monitor:eDP-1, default:true, persistent:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:HDMI-A-1, default:true
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
